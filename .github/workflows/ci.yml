name: CI

# The M0 skeleton: component integrity, fmt, clippy -D warnings, test, no-egress
# (CONSOLIDATION-ROADMAP.md §4 M0, as superseded by MD-6).
#
# It is wired before there is any engine code to run through it, so that M1's first commit inherits
# a gate that is already red-if-broken rather than one written afterwards to fit whatever it built.
# Today the `test` job runs the M0 charter gate — the decision records are present, well-formed and
# accepted, and the validator that says so has been watched failing on each rule it enforces.
#
# Green locally is not done. Green here is done.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:23 UTC. An odd minute on purpose, and a different one from Schweep's 03:17, so the two
    # repositories' nightlies do not queue behind each other on the same shared runners.
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail rather than hang if the network is unexpectedly involved.
  CARGO_NET_RETRY: 2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-integrity:
    name: exact component imports and honest admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python3 scripts/verify_component_lock.py

  component-compatibility:
    name: component compatibility (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [substrate, loomdb, prismdb, schweep]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: components/${{ matrix.component }} -> target
      # Quarantine prevents product linkage; it does not excuse source incompatibility. Every
      # imported workspace must resolve from its lock and compile in the exact monorepo layout.
      - name: Check every supported feature profile
        run: |
          set -euo pipefail
          if [ "${{ matrix.component }}" = "loomdb" ]; then
            # Loom intentionally makes `remote` and `airgap` mutually exclusive, so Cargo's
            # synthetic `--all-features` profile is invalid by design. Exercise its real profiles.
            cargo check --workspace --all-targets --locked
            bash scripts/verify_build_flavours.sh
          else
            cargo check --workspace --all-targets --all-features --locked
          fi
      - name: Clippy every supported default target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # --all-targets so tests are linted too: the workspace forbids unsafe and denies
      # unwrap/expect/panic, and the allowances that re-enable them in tests must be explicit.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo test --workspace --all-features --locked
      # Again, alone and uncaptured, so the M0 gate's result is legible in the job log rather than
      # buried among the mutation tests that prove it can fail.
      - name: The M0 charter gate (MD-1…MD-4 and MD-6 present, well-formed, accepted)
        run: cargo test -p mutiny-charter --locked --test m0_gate -- --nocapture

  m1-bridge:
    name: M1 commit-to-epoch differential and crash gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove reviewed plane dependencies only
        run: python3 scripts/verify_dependency_boundaries.py
      - name: Prove epoch=commit, exactly-once, completeness, and crash recovery
        run: cargo test -p mutiny-bridge --locked --test m1_gate -- --nocapture

  m2-semantic:
    name: M2 bridge, grouping, migration, cold-route, and exact-oracle gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove the frozen composed semantic contract and PrismDB equivalence
        run: cargo test -p mutiny-semantic --locked --test m2_gate -- --nocapture

  m3-trust:
    name: M3 mounted trust, Loom demo, and four model oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove capability-scoped branch results and propose-not-execute separation
        run: cargo test -p mutiny-trust --locked --test m3_gate -- --nocapture
      - name: Run Loom's scripted buyer demo verbatim through its MCP door
        run: cargo test --manifest-path components/loomdb/Cargo.toml -p loom-mcp --locked --test demo the_q3_demo_runs_verbatim -- --nocapture
      - name: Re-run Loom's four unmodified model oracles on the imported tree
        run: |
          cargo test --manifest-path components/loomdb/Cargo.toml -p loom-branch --locked --test oracle
          cargo test --manifest-path components/loomdb/Cargo.toml -p loom-provenance --locked --test oracle
          cargo test --manifest-path components/loomdb/Cargo.toml -p loom-memory --locked --test isolation
          cargo test --manifest-path components/loomdb/Cargo.toml -p loom-policy --locked --test oracle

  m4-taint:
    name: M4 cross-circuit taint flagship gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove the taint core's report and predicate laws
        run: cargo test -p mutiny-taint --locked -- --nocapture
      - name: Prove the frozen incident corpus heals to the never-ingested oracle, with teeth and crash seams
        run: cargo test -p mutiny-incident --locked --test m4_gate -- --nocapture
      # The M4 dev demo binary was retired at M6; the supported form of the flagship demo is the
      # scripted agent over MCP against mutinyd, run by the m6-surface job (docs/M6-SURFACE.md).

  m5-forks:
    name: M5 forked standing state gate and spike evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove the fork-lineage model's laws
        run: cargo test -p mutiny-forks --locked --lib -- --nocapture
      - name: Re-run the MD-5 spike (criteria measured, verdict on record)
        run: cargo test -p mutiny-forks --locked --test m5_spike -- --nocapture
      - name: Prove the forked corpus, isolation oracle, crash seams, and M4×M5 heal
        run: cargo test -p mutiny-incident --locked --test m5_gate -- --nocapture
      - name: Prove the fork economics are O(state), said out loud
        run: cargo test -p mutiny-incident --locked --test m5_fork_cost -- --nocapture

  m6-surface:
    name: M6 one surface — doors, same-door law, kill matrix, soak, MCP demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove the doors, the same-door law, the resume tokens, and teeth (a)(b)
        run: cargo test -p mutinyd --locked --test m6_gate -- --nocapture
      - name: Prove the kill matrix at PR scale (the nightly runs 1,000)
        run: M6_KILLS=60 cargo test -p mutinyd --locked --test m6_kill_matrix -- --nocapture
      - name: Prove the soak's flat shape at PR scale (the nightly runs the long soak)
        run: M6_SOAK_SECS=30 cargo test -p mutinyd --locked --test m6_soak -- --nocapture
      - name: Run the flagship end-to-end over MCP (the supported demo form)
        run: |
          cargo run -p mutinyd --locked --example incident_demo_mcp -- --help | grep -q "NOT a supported"
          cargo run -p mutinyd --locked --example incident_demo_mcp > /dev/null

  m6-quickstart:
    name: M6 quickstart, verbatim from the README (tooth c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run exactly what the README tells a stranger to run
        run: ./scripts/run_quickstart.sh

  no-egress:
    name: no-egress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      # The only step permitted to reach the network. Everything after it runs with the network
      # removed, so anything that tries to fetch, phone home, or reach a fixture server fails.
      - name: Fetch dependencies (the only networked step)
        run: cargo fetch --locked

      - name: Build the suite offline
        run: cargo test --workspace --all-features --locked --offline --no-run

      # A no-egress job that silently still has egress proves nothing, so the sandbox is verified
      # before it is trusted: unshare must work, and inside it a connection must fail.
      - name: Prove the sandbox really has no network
        run: |
          set -euo pipefail
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so `unshare -rn`
          # fails on a stock runner. Lifting that one restriction is enough; the alternative —
          # running the suite as root under `sudo unshare -n` — would test it as a different user
          # than every other job.
          if ! unshare -rn true 2>/dev/null; then
            echo "unprivileged user namespaces are restricted; enabling them for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if ! unshare -rn true; then
            echo "::error::unshare -rn is unavailable on this runner; this job cannot prove the" \
                 "absence of egress and must not pass by default"
            exit 1
          fi
          if unshare -rn timeout 5 bash -c 'exec 3<>/dev/tcp/1.1.1.1/53' 2>/dev/null; then
            echo "::error::a TCP connection succeeded inside the sandbox; the no-egress job would" \
                 "be measuring nothing"
            exit 1
          fi
          echo "sandbox verified: unshare works and outbound TCP fails inside it"

      # Loopback is brought up INSIDE the namespace: M6's composed gates speak real HTTP over
      # 127.0.0.1, and loopback is not egress — the interface list inside the sandbox is lo and
      # nothing else, and the outbound-TCP proof above already showed the outside is unreachable.
      - name: Run the whole suite with no network
        run: unshare -rn bash -c 'ip link set lo up && cargo test --workspace --all-features --locked --offline'

  # A single required check, so branch protection has one name to point at rather than four that
  # drift as jobs are added.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [component-integrity, component-compatibility, fmt, clippy, test, m1-bridge, m2-semantic, m3-trust, m4-taint, m5-forks, m6-surface, m6-quickstart, no-egress]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::at least one CI job did not succeed"
            exit 1
          fi
          echo "all CI jobs succeeded"
