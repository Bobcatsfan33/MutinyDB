name: Release

on:
  push:
    tags: ["mutinydb-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Verify tag and source version agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="mutinydb-v$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/mutinyd/Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "$expected"
      - run: python3 scripts/verify_component_lock.py
      - run: cargo fmt --all --check
      - run: cargo clippy -p mutinyd --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p mutinyd --all-features --locked

  binaries:
    name: binary (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p mutinyd --locked
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          archive="mutinydb-${platform}.tar.gz"
          tar -czf "$archive" -C target/release mutinyd -C ../../ LICENSE deploy/quickstart.json
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutinydb-${{ matrix.os }}
          path: |
            mutinydb-*.tar.gz
            mutinydb-*.sha256
          if-no-files-found: error

  container:
    name: multi-architecture container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mutinydb
          tags: |
            type=match,pattern=mutinydb-v(.*),group=1
            type=match,pattern=mutinydb-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          generate_release_notes: true
          files: dist/*
