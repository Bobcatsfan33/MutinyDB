# M5 — forked standing state. The spike (tests/m5_spike.rs) ran first, against MD-5's
# pre-committed criteria; the library implements the path the verdict selected.
#
# The substrate and loom-branch edges exist for the spike evidence: copy-on-write operator state
# on substrate pages, measured on the imported trees. The library itself is pure fork-lineage
# logic (records, descendants, merge planning) with no storage dependency of its own.
[package]
name = "mutiny-forks"
version = "0.1.0"
edition = "2021"
publish = false
description = "Forked standing state: fork lineage, merge planning, and the M5 spike evidence."

[dependencies]
loom-core.workspace = true
schweep-zset.workspace = true
thiserror.workspace = true

[dev-dependencies]
loom-branch.workspace = true
substrate-pager.workspace = true

[lints]
workspace = true
