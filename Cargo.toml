# MutinyDB — the workspace.
#
# Exact, quarantined source imports live under `components/`; MD-6 and components.lock.json keep
# development linkage separate from release admission. M1's bridge is the first composed crate,
# while no supported product binary may include a component whose release admission is blocked.
#
# CONSOLIDATION-ROADMAP.md §4 M0 says the exit gate is "CI skeleton (fmt/clippy/test/no-egress)
# green on an empty workspace" — the seam is wired before the code arrives, so M1's first commit
# inherits a gate that is already red-if-broken rather than one written to fit whatever it built.
# M0 wrote the decision records and exact imports. M1 now adds the bridge and composed gates;
# there are still no semantic operators (M2), mounted planes (M3), or product binary (M6).
#
# `members` is not literally empty, because a literally empty virtual workspace is not something
# cargo can act on: `cargo fmt --all` exits 1 with "Failed to find targets", and clippy and test
# both refuse with "the manifest is virtual, and the workspace has no members". A CI skeleton whose
# four jobs all error out is not a green gate, and a skeleton whose jobs are skipped or `|| true`'d
# into passing is worse — it is a gate that reports success while measuring nothing, which is the
# exact failure mode I-10 exists to prevent. `mutiny-charter` remains that M0 proof; M1 adds
# `mutiny-bridge` without weakening it.
#
# What this file is allowed to grow, and when:
#   M1  crates/mutiny-bridge         substrate commit stream -> Schweep epoch inputs (MD-2)
#   M2  crates/mutiny-semantic       Prism's operators inside the compute plane
#   M3  crates/mutiny-trust          Loom's planes mounted over the shared catalog
#   M4  crates/mutiny-taint          taint-as-retraction across every plane (K-2)
#   M4  crates/mutiny-incident       the frozen incident corpus, gate, and dev-only demo host
#   M5  crates/mutiny-forks          forked standing state: spike evidence + fork lineage (K-3)
#   M6  crates/mutinyd               the one process, the three doors
# Nothing may be added ahead of its phase. (§6: "no phase starts before its named gates".)
[workspace]
resolver = "3"
members = [
    "crates/mutiny-charter",
    "crates/mutiny-bridge",
    "crates/mutiny-semantic",
    "crates/mutiny-trust",
    "crates/mutiny-taint",
    "crates/mutiny-incident",
    "crates/mutiny-forks",
]
exclude = [
    "components/loomdb",
    "components/prismdb",
    "components/schweep",
    "components/substrate",
]

# MD-6 replaces the sibling/tag topology with workspace-local component source. These paths enable
# composed development and testing; they do not change the component lock's release-admission state.
[workspace.dependencies]
blake3 = "1.5"
bincode = "1.3"
loom-core = { path = "components/loomdb/crates/loom-core" }
loom-action = { path = "components/loomdb/crates/loom-action" }
loom-branch = { path = "components/loomdb/crates/loom-branch", default-features = false, features = ["airgap"] }
loom-policy = { path = "components/loomdb/crates/loom-policy" }
prism-types = { path = "components/prismdb/crates/prism-types" }
schweep-log = { path = "components/schweep/crates/schweep-log" }
schweep-memo = { path = "components/schweep/crates/schweep-memo" }
schweep-server = { path = "components/schweep/crates/schweep-server" }
schweep-zset = { path = "components/schweep/crates/schweep-zset" }
serde = { version = "1", features = ["derive"] }
substrate-pager = { path = "components/substrate/crates/substrate-pager" }
substrate-wal = { path = "components/substrate/crates/substrate-wal" }
thiserror = "2"

# The lints M1's crates inherit with `[lints] workspace = true`. They were stated before code,
# because a lint added after the code exists is a lint that gets
# `#[allow]`d instead of obeyed. Schweep's D-1 discipline, adopted verbatim: no unsafe, and no
# panicking constructs in library code.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
