[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mutinydb"
version = "0.1.0"
description = "Zero-dependency Python client for MutinyDB"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "MutinyDB contributors"}]
keywords = ["database", "agents", "incremental", "provenance", "semantic-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Bobcatsfan33/MutinyDB"
Issues = "https://github.com/Bobcatsfan33/MutinyDB/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mutinydb"]
